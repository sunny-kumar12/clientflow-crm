<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1">

    <title>Settings | ClientFlow CRM</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        :root {
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --text-color: #1f2937;
            --muted-color: #6b7280;
            --border-color: #e5e7eb;
            --background-color: #f5f7fb;
        }

        body {
            background: var(--background-color);
            color: var(--text-color);
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        .page-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .page-title {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .page-subtitle {
            color: var(--muted-color);
            margin-bottom: 0;
        }

        .settings-card {
            background: #fff;
            border: 1px solid var(--border-color);
            border-radius: 14px;
            box-shadow: 0 8px 28px rgba(31, 41, 55, 0.06);
            overflow: hidden;
        }

        .settings-card-header {
            padding: 22px 28px;
            border-bottom: 1px solid var(--border-color);
        }

        .settings-card-header h5 {
            margin: 0;
            font-weight: 700;
        }

        .settings-card-body {
            padding: 28px;
        }

        .profile-box {
            background: #f8fafc;
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            padding: 20px;
        }

        .profile-label {
            color: var(--muted-color);
            font-size: 0.85rem;
            margin-bottom: 4px;
        }

        .profile-value {
            font-weight: 600;
            font-size: 1rem;
        }

        .form-label {
            font-weight: 600;
            font-size: 0.92rem;
            margin-bottom: 8px;
        }

        .form-control {
            min-height: 44px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 10px 12px;
        }

        .form-control:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .validation-error {
            display: block;
            color: #dc2626;
            font-size: 0.85rem;
            margin-top: 5px;
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding-top: 24px;
            margin-top: 24px;
            border-top: 1px solid var(--border-color);
        }

        .btn {
            border-radius: 8px;
            padding: 10px 18px;
            font-weight: 600;
        }

        .btn-primary {
            background: var(--primary-color);
            border-color: var(--primary-color);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            border-color: var(--primary-hover);
        }

        @media (max-width: 576px) {

            .page-container {
                padding: 24px 12px;
            }

            .settings-card-body {
                padding: 20px 16px;
            }

            .settings-card-header {
                padding: 18px 16px;
            }

            .page-title {
                font-size: 1.45rem;
            }

            .form-actions {
                flex-direction: column;
            }

            .form-actions .btn {
                width: 100%;
            }
        }

    </style>

</head>

<body>

<div class="page-container">

    <!-- Page Header -->

    <div class="d-flex justify-content-between
                align-items-center
                flex-wrap
                gap-3
                mb-4">

        <div>

            <h1 class="page-title">
                Settings
            </h1>

            <p class="page-subtitle">
                Manage your ClientFlow account and security settings.
            </p>

        </div>

        <a th:href="@{/dashboard}"
           class="btn btn-outline-secondary">

            ← Back to Dashboard

        </a>

    </div>


    <!-- Success Message -->

    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}">
    </div>


    <!-- Error Message -->

    <div th:if="${errorMessage}"
         class="alert alert-danger"
         th:text="${errorMessage}">
    </div>


    <!-- Account Information -->

    <div class="settings-card mb-4">

        <div class="settings-card-header">

            <h5>
                Account Information
            </h5>

        </div>

        <div class="settings-card-body">

            <div class="profile-box">

                <div class="row g-4">

                    <div class="col-md-6">

                        <div class="profile-label">
                            Username
                        </div>

                        <div class="profile-value"
                             th:text="${user.username}">
                            username
                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="profile-label">
                            Role
                        </div>

                        <div>

                            <span class="badge text-bg-primary"
                                  th:text="${user.role}">
                                SALES
                            </span>

                        </div>

                    </div>

                    <div class="col-md-6">

                        <div class="profile-label">
                            Account Status
                        </div>

                        <div>

                            <span th:if="${user.enabled}"
                                  class="badge text-bg-success">
                                Active
                            </span>

                            <span th:unless="${user.enabled}"
                                  class="badge text-bg-danger">
                                Disabled
                            </span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>


    <!-- Change Password -->

    <div class="settings-card">

        <div class="settings-card-header">

            <h5>
                Change Password
            </h5>

        </div>

        <div class="settings-card-body">

            <form th:action="@{/settings/password}"
                  th:object="${settingsForm}"
                  method="post">

                <!-- CSRF -->

                <input type="hidden"
                       th:if="${_csrf != null}"
                       th:name="${_csrf.parameterName}"
                       th:value="${_csrf.token}">


                <div class="row g-4">

                    <!-- Current Password -->

                    <div class="col-12">

                        <label for="currentPassword"
                               class="form-label">

                            Current Password

                        </label>

                        <input
                                id="currentPassword"
                                type="password"
                                class="form-control"
                                th:field="*{currentPassword}"
                                placeholder="Enter your current password"
                                autocomplete="current-password">

                        <span
                                class="validation-error"
                                th:errors="*{currentPassword}">
                        </span>

                    </div>


                    <!-- New Password -->

                    <div class="col-md-6">

                        <label for="newPassword"
                               class="form-label">

                            New Password

                        </label>

                        <input
                                id="newPassword"
                                type="password"
                                class="form-control"
                                th:field="*{newPassword}"
                                placeholder="Enter new password"
                                autocomplete="new-password">

                        <span
                                class="validation-error"
                                th:errors="*{newPassword}">
                        </span>

                    </div>


                    <!-- Confirm Password -->

                    <div class="col-md-6">

                        <label for="confirmPassword"
                               class="form-label">

                            Confirm New Password

                        </label>

                        <input
                                id="confirmPassword"
                                type="password"
                                class="form-control"
                                th:field="*{confirmPassword}"
                                placeholder="Confirm new password"
                                autocomplete="new-password">

                        <span
                                class="validation-error"
                                th:errors="*{confirmPassword}">
                        </span>

                    </div>

                </div>


                <!-- Actions -->

                <div class="form-actions">

                    <a th:href="@{/dashboard}"
                       class="btn btn-outline-secondary">

                        Cancel

                    </a>

                    <button type="submit"
                            class="btn btn-primary">

                        Change Password

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

</body>

</html>
