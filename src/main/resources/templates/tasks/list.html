<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tasks | ClientFlow CRM</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
        }

        .page-header p {
            color: #64748b;
            margin-bottom: 0;
        }

        .task-card {
            background: #fff;
            border: 1px solid #e8edf4;
            border-radius: 14px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .task-title {
            font-size: 17px;
            font-weight: 700;
        }

        .task-description {
            color: #64748b;
            margin-top: 8px;
            white-space: pre-wrap;
        }

        .task-meta {
            color: #64748b;
            font-size: 14px;
            margin-top: 12px;
        }

        .badge-status,
        .badge-priority {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-status {
            background: #eef2ff;
            color: #4338ca;
        }

        .badge-priority {
            background: #f1f5f9;
            color: #475569;
        }

        .priority-high {
            background: #fef2f2;
            color: #b91c1c;
        }

        .priority-medium {
            background: #fff7ed;
            color: #c2410c;
        }

        .priority-low {
            background: #f0fdf4;
            color: #15803d;
        }

        .empty-state {
            background: #fff;
            border: 1px solid #e8edf4;
            border-radius: 14px;
            padding: 50px 20px;
            text-align: center;
        }

        .empty-state i {
            font-size: 42px;
            color: #94a3b8;
        }

        .due-date {
            font-weight: 600;
        }

        .overdue {
            color: #dc2626;
        }
    </style>
</head>

<body>

<div class="container-fluid p-4 p-lg-5">

    <!-- Page Header -->
    <header class="page-header">

        <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">

            <div>
                <h1>Tasks</h1>

                <p>
                    Create, track, and manage customer and lead tasks.
                </p>
            </div>

            <div class="d-flex gap-2">

                <a th:href="@{/tasks/new}"
                   class="btn btn-primary">

                    <i class="bi bi-plus-lg me-2"></i>
                    Create Task

                </a>

                <a th:href="@{/dashboard}"
                   class="btn btn-outline-secondary">

                    <i class="bi bi-arrow-left me-2"></i>
                    Dashboard

                </a>

            </div>

        </div>

    </header>


    <!-- Success Message -->
    <div th:if="${successMessage}"
         class="alert alert-success">

        <i class="bi bi-check-circle me-2"></i>

        <span th:text="${successMessage}">
            Task created successfully.
        </span>

    </div>


    <!-- Task List -->
    <div th:if="${!tasks.isEmpty()}">

        <div th:each="task : ${tasks}"
             class="task-card">

            <div class="d-flex flex-wrap justify-content-between gap-3">

                <div class="flex-grow-1">

                    <!-- Status + Priority -->
                    <div class="d-flex flex-wrap gap-2">

                        <span class="badge-status"
                              th:text="${#strings.replace(
                                  task.status.name(),
                                  '_',
                                  ' '
                              )}">
                            TODO
                        </span>

                        <span class="badge-priority"
                              th:classappend="${task.priority.name() == 'HIGH'
                                  ? ' priority-high'
                                  : task.priority.name() == 'MEDIUM'
                                  ? ' priority-medium'
                                  : ' priority-low'}"
                              th:text="${task.priority}">
                            MEDIUM
                        </span>

                    </div>


                    <!-- Title -->
                    <div class="task-title mt-2"
                         th:text="${task.title}">

                        Task title

                    </div>


                    <!-- Description -->
                    <div th:if="${task.description != null
                                 and !#strings.isEmpty(task.description)}"
                         class="task-description"
                         th:text="${task.description}">

                        Task description

                    </div>


                    <!-- Meta -->
                    <div class="task-meta">

                        <!-- Due Date -->
                        <span th:if="${task.dueDate != null}"
                              class="due-date">

                            <i class="bi bi-calendar3 me-1"></i>

                            Due:

                            <span th:text="${#temporals.format(
                                task.dueDate,
                                'dd MMM yyyy'
                            )}">
                                14 Oct 2026
                            </span>

                        </span>


                        <!-- Customer -->
                        <span class="ms-3"
                              th:if="${task.customer != null}">

                            <i class="bi bi-person me-1"></i>

                            Customer:

                            <strong th:text="${task.customer.name}">
                                Customer
                            </strong>

                        </span>


                        <!-- Lead -->
                        <span class="ms-3"
                              th:if="${task.lead != null}">

                            <i class="bi bi-funnel me-1"></i>

                            Lead:

                            <strong th:text="${task.lead.name}">
                                Lead
                            </strong>

                        </span>

                    </div>

                </div>


                <!-- Task Actions -->
                <div class="d-flex gap-2">

                    <!-- Edit -->
                    <a th:href="@{/tasks/{id}/edit(id=${task.id})}"
                       class="btn btn-sm btn-outline-primary">

                        <i class="bi bi-pencil"></i>
                        Edit

                    </a>


                    <!-- Delete -->
                    <form th:action="@{/tasks/{id}/delete(id=${task.id})}"
                          method="post"
                          onsubmit="return confirm('Delete this task?');">

                        <button type="submit"
                                class="btn btn-sm btn-outline-danger">

                            <i class="bi bi-trash"></i>

                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>


    <!-- Empty State -->
    <div th:if="${tasks.isEmpty()}"
         class="empty-state">

        <i class="bi bi-check2-square"></i>

        <h3 class="mt-3">
            No tasks yet
        </h3>

        <p class="text-secondary">
            Create your first customer or lead task.
        </p>

        <a th:href="@{/tasks/new}"
           class="btn btn-primary">

            <i class="bi bi-plus-lg me-2"></i>
            Create Task

        </a>

    </div>

</div>

</body>
</html>
