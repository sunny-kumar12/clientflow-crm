<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Sales Pipeline | ClientFlow CRM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6fa;
        }

        .pipeline-columns {
            display: grid;
            grid-template-columns: repeat(3, minmax(250px, 1fr));
            gap: 16px;
            align-items: start;
        }

        .pipeline-column {
            background: #e9edf5;
            border-radius: 12px;
            padding: 14px;
            min-width: 0;
        }

        .lead-card {
            background: white;
            border-radius: 9px;
            padding: 14px;
            margin-top: 12px;
            box-shadow: 0 2px 6px #0000000a;
        }

        @media (max-width: 900px) {
            .pipeline-columns {
                grid-template-columns: repeat(2, minmax(240px, 1fr));
            }
        }

        @media (max-width: 580px) {
            .pipeline-columns {
                grid-template-columns: minmax(0, 1fr);
            }
        }
    </style>
</head>

<body>

<main class="container-fluid px-4 py-4">

    <!-- Page heading -->
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h3 mb-1">Sales Pipeline</h1>
            <p class="text-secondary mb-0">
                Track leads from prospect to closed deal.
            </p>
        </div>

        <div class="d-flex gap-2">
            <a th:href="@{/leads/new}" class="btn btn-primary">
                + New Lead
            </a>
            <a th:href="@{/dashboard}" class="btn btn-outline-secondary">
                Dashboard
            </a>
        </div>
    </div>

    <!-- Success message -->
    <div th:if="${successMessage}"
         class="alert alert-success"
         th:text="${successMessage}">
    </div>

    <!-- Pipeline summary -->
    <div class="row g-3 mb-4">

        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm card-body">
                <div class="text-secondary">Total Leads</div>
                <div class="h3 mb-0"
                     th:text="${pipeline.totalLeads()}">0</div>
            </div>
        </div>

        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm card-body">
                <div class="text-secondary">Open Pipeline Value</div>
                <div class="h3 mb-0"
                     th:text="${#numbers.formatDecimal(pipeline.openValue(), 1, 2)}">
                    0.00
                </div>
            </div>
        </div>

        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm card-body">
                <div class="text-secondary">Won Deal Value</div>
                <div class="h3 mb-0"
                     th:text="${#numbers.formatDecimal(pipeline.wonValue(), 1, 2)}">
                    0.00
                </div>
            </div>
        </div>

        <div class="col-sm-6 col-lg-3">
            <div class="card border-0 shadow-sm card-body">
                <div class="text-secondary">Win Rate</div>
                <div class="h3 mb-0"
                     th:text="${#numbers.formatDecimal(pipeline.winRate(), 1, 1) + '%'}">
                    0%
                </div>
            </div>
        </div>

    </div>

    <!-- Pipeline columns -->
    <div class="pipeline-columns">

        <section th:each="stage : ${statuses}"
                 class="pipeline-column">

            <!-- Stage heading, lead count and total value -->
            <div class="d-flex justify-content-between align-items-start">
                <div>
                    <h2 class="h6 mb-0" th:text="${stage}">NEW</h2>

                    <div class="small text-secondary mt-1">
                        Value:
                        <strong th:text="${#numbers.formatDecimal(
                            pipeline.stageValues().get(stage) != null
                                ? pipeline.stageValues().get(stage) : 0,
                            1, 2
                        )}">0.00</strong>
                    </div>
                </div>

                <span class="badge text-bg-secondary"
                      th:text="${pipeline.counts().get(stage)}">0</span>
            </div>

            <!-- Lead cards -->
            <div th:each="lead : ${pipeline.leadsByStatus().get(stage)}"
                 class="lead-card">

                <div class="fw-semibold mb-1"
                     th:text="${lead.name}">
                    Lead Name
                </div>

                <div class="small text-secondary mb-2"
                     th:text="${lead.company != null ? lead.company : 'No company'}">
                    Company
                </div>

                <div class="small mb-3">
                    Estimated value:
                    <strong th:text="${#numbers.formatDecimal(
                        lead.estimatedValue != null ? lead.estimatedValue : 0,
                        1, 2
                    )}">0.00</strong>
                </div>

                <!-- Move lead to another stage -->
                <form th:action="@{/pipeline/{id}/status(id=${lead.id})}"
                      method="post"
                      class="d-flex gap-2">

                    <select name="status"
                            class="form-select form-select-sm"
                            aria-label="Move lead to stage">

                        <option th:each="nextStage : ${statuses}"
                                th:value="${nextStage}"
                                th:text="${nextStage}"
                                th:selected="${nextStage == stage}">
                        </option>
                    </select>

                    <button class="btn btn-sm btn-outline-primary"
                            type="submit">
                        Move
                    </button>
                </form>

                <a class="small d-inline-block mt-2"
                   th:href="@{/leads/{id}/edit(id=${lead.id})}">
                    Edit lead
                </a>

            </div>

            <!-- Empty-column message -->
            <div th:if="${pipeline.counts().get(stage) == 0}"
                 class="small text-secondary mt-3">
                No leads in this stage.
            </div>

        </section>

    </div>

</main>

</body>
</html>
