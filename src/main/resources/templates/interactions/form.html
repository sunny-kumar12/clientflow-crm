<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${pageTitle} + ' | ClientFlow'">
        Record Interaction | ClientFlow
    </title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">

    <style>
        body {
            background: #f5f7fb;
            color: #1e293b;
            font-family: Arial, sans-serif;
        }

        .page-wrapper {
            max-width: 1000px;
            margin: 0 auto;
        }

        .page-header {
            margin-bottom: 28px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .page-header p {
            color: #64748b;
            margin-bottom: 0;
        }

        .form-card {
            background: #ffffff;
            border: 1px solid #e8edf4;
            border-radius: 16px;
            padding: 28px;
        }

        .form-section-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .form-label {
            font-weight: 600;
            font-size: 14px;
            color: #334155;
        }

        .form-control,
        .form-select {
            border: 1px solid #dbe2ea;
            border-radius: 9px;
            padding: 11px 13px;
        }

        .form-control:focus,
        .form-select:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
        }

        textarea.form-control {
            min-height: 130px;
            resize: vertical;
        }

        .form-help {
            color: #64748b;
            font-size: 12px;
            margin-top: 5px;
        }

        .form-actions {
            border-top: 1px solid #e8edf4;
            margin-top: 28px;
            padding-top: 22px;
        }

        .btn-primary {
            background: #4f46e5;
            border-color: #4f46e5;
        }

        .btn-primary:hover {
            background: #4338ca;
            border-color: #4338ca;
        }

        .required {
            color: #dc2626;
        }
    </style>
</head>

<body>

<div class="container-fluid p-4 p-lg-5">

    <div class="page-wrapper">

        <!-- Header -->
        <header class="page-header">

            <div class="d-flex flex-wrap justify-content-between align-items-center gap-3">

                <div>
                    <h1 th:text="${pageTitle}">
                        Record Interaction
                    </h1>

                    <p>
                        Record a call, email, meeting, or note for a customer or lead.
                    </p>
                </div>

                <a th:href="@{/interactions}"
                   class="btn btn-outline-secondary">

                    <i class="bi bi-arrow-left me-2"></i>
                    Back to Interactions

                </a>

            </div>

        </header>


        <!-- Form -->
        <div class="form-card">

            <form th:action="@{/interactions}"
                  th:object="${interaction}"
                  method="post">

                <!-- Basic Information -->
                <h2 class="form-section-title">
                    Interaction Details
                </h2>

                <div class="row g-4">

                    <!-- Interaction Type -->
                    <div class="col-12 col-md-6">

                        <label for="type"
                               class="form-label">

                            Interaction Type
                            <span class="required">*</span>

                        </label>

                        <select id="type"
                                th:field="*{type}"
                                class="form-select"
                                required>

                            <option value="">
                                Select interaction type
                            </option>

                            <option th:each="type : ${types}"
                                    th:value="${type}"
                                    th:text="${#strings.capitalize(type.name().toLowerCase())}">
                                Call
                            </option>

                        </select>

                    </div>


                    <!-- Interaction Date -->
                    <div class="col-12 col-md-6">

                        <label for="interactionDate"
                               class="form-label">

                            Date &amp; Time
                            <span class="required">*</span>

                        </label>

                        <input type="datetime-local"
                               id="interactionDate"
                               th:field="*{interactionDate}"
                               class="form-control"
                               required>

                    </div>


                    <!-- Subject -->
                    <div class="col-12">

                        <label for="subject"
                               class="form-label">

                            Subject
                            <span class="required">*</span>

                        </label>

                        <input type="text"
                               id="subject"
                               th:field="*{subject}"
                               class="form-control"
                               placeholder="e.g. Follow-up call regarding proposal"
                               maxlength="255"
                               required>

                    </div>


                    <!-- Customer -->
                    <div class="col-12 col-md-6">

                        <label for="customerId"
                               class="form-label">

                            Customer

                        </label>

                        <select id="customerId"
                                name="customerId"
                                class="form-select">

                            <option value="">
                                Select customer
                            </option>

                            <option th:each="customer : ${customers}"
                                    th:value="${customer.id}"
                                    th:text="${customer.name}">
                                Customer Name
                            </option>

                        </select>

                        <div class="form-help">
                            Select the customer associated with this interaction.
                        </div>

                    </div>


                    <!-- Lead -->
                    <div class="col-12 col-md-6">

                        <label for="leadId"
                               class="form-label">

                            Lead

                        </label>

                        <select id="leadId"
                                name="leadId"
                                class="form-select">

                            <option value="">
                                Select lead
                            </option>

                            <option th:each="lead : ${leads}"
                                    th:value="${lead.id}"
                                    th:text="${lead.name}">
                                Lead Name
                            </option>

                        </select>

                        <div class="form-help">
                            Select the lead associated with this interaction.
                        </div>

                    </div>


                    <!-- Notes -->
                    <div class="col-12">

                        <label for="notes"
                               class="form-label">

                            Notes

                        </label>

                        <textarea id="notes"
                                  th:field="*{notes}"
                                  class="form-control"
                                  placeholder="Add details about this interaction..."
                                  maxlength="5000"></textarea>

                    </div>

                </div>


                <!-- Actions -->
                <div class="form-actions">

                    <div class="d-flex justify-content-end gap-2">

                        <a th:href="@{/interactions}"
                           class="btn btn-outline-secondary">

                            Cancel

                        </a>

                        <button type="submit"
                                class="btn btn-primary">

                            <i class="bi bi-check2-circle me-2"></i>
                            Save Interaction

                        </button>

                    </div>

                </div>

            </form>

        </div>

    </div>

</div>

</body>
</html>
