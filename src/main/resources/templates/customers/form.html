<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Customer Form | ClientFlow CRM</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/dashboard.css}">
</head>
<body>

<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">
        <div th:replace="~{fragments/navbar :: navbar}"></div>

        <section class="dashboard-content">

            <div class="section-heading">
                <div>
                    <h2 th:text="${customerId == null} ? 'Add Customer' : 'Edit Customer'">
                        Add Customer
                    </h2>
                    <p>Enter accurate contact information for this customer.</p>
                </div>

                <a th:href="@{/customers}" class="btn btn-light">
                    <i class="bi bi-arrow-left me-2"></i>Back to Customers
                </a>
            </div>

            <section class="content-card form-card">

                <div class="card-heading">
                    <div>
                        <h3>Customer Information</h3>
                        <p>Fields marked with * are required.</p>
                    </div>
                </div>

                <form th:action="${customerId == null} ?
                         @{/customers} :
                         @{/customers/{id}(id=${customerId})}"
                      th:object="${customerForm}"
                      method="post"
                      class="customer-form">

                    <div class="row g-4">

                        <div class="col-md-6">
                            <label for="name" class="form-label">
                                Customer Name *
                            </label>
                            <input id="name" type="text"
                                   th:field="*{name}"
                                   th:errorclass="is-invalid"
                                   class="form-control"
                                   placeholder="e.g. Aarav Sharma"
                                   maxlength="100" required>
                            <div class="invalid-feedback"
                                 th:errors="*{name}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="company" class="form-label">
                                Company
                            </label>
                            <input id="company" type="text"
                                   th:field="*{company}"
                                   th:errorclass="is-invalid"
                                   class="form-control"
                                   placeholder="Company name"
                                   maxlength="120">
                            <div class="invalid-feedback"
                                 th:errors="*{company}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="email" class="form-label">
                                Email Address *
                            </label>
                            <input id="email" type="email"
                                   th:field="*{email}"
                                   th:errorclass="is-invalid"
                                   class="form-control"
                                   placeholder="name@example.com"
                                   maxlength="150" required>
                            <div class="invalid-feedback"
                                 th:errors="*{email}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="phone" class="form-label">
                                Phone Number
                            </label>
                            <input id="phone" type="tel"
                                   th:field="*{phone}"
                                   th:errorclass="is-invalid"
                                   class="form-control"
                                   placeholder="+91 9876543210"
                                   maxlength="20">
                            <div class="invalid-feedback"
                                 th:errors="*{phone}"></div>
                        </div>

                        <div class="col-md-6">
                            <label for="status" class="form-label">
                                Customer Status *
                            </label>
                            <select id="status" th:field="*{status}"
                                    th:errorclass="is-invalid"
                                    class="form-select" required>
                                <option value="">Select status</option>
                                <option th:each="s : ${statuses}"
                                        th:value="${s}"
                                        th:text="${s}">
                                </option>
                            </select>
                            <div class="invalid-feedback"
                                 th:errors="*{status}"></div>
                        </div>

                    </div>

                    <div class="form-actions">
                        <a th:href="@{/customers}"
                           class="btn btn-light">Cancel</a>

                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check2 me-2"></i>
                            <span th:text="${customerId == null} ?
                                  'Create Customer' : 'Save Changes'">
                                Create Customer
                            </span>
                        </button>
                    </div>

                </form>
            </section>
        </section>
    </main>
</div>

</body>
</html>
