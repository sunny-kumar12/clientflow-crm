spring.application.name=clientflow-crm

# ==============================
# Server
# ==============================
server.port=8080

# ==============================
# MySQL Database
# ==============================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/clientflow_crm}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}

# ==============================
# Hibernate / JPA
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# Thymeleaf
# ==============================
spring.thymeleaf.cache=false

# ==============================
# Bootstrap Admin
# ==============================
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:admin}

# ==============================
# Bootstrap Sales
# ==============================
app.bootstrap.sales.username=${BOOTSTRAP_SALES_USERNAME:user}
app.bootstrap.sales.password=${BOOTSTRAP_SALES_PASSWORD:user}